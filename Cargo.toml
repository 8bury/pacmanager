[package]
name = "pacmanager"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Uma loja simples para pacotes do Arch Linux e AUR"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.36", default-features = false, features = ["file", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
flate2 = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
